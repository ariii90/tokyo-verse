<!DOCTYPE html> 
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Mapa do Mundo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="mapa.css">
</head>

<body>

  <!-- HUD -->
  <div id="hud">

    <div class="hud-esquerda">
      <span id="relogioMundo">08:00</span>

      <button id="btnMenosHora">-1h</button>
      <button id="btnMaisHora">+1h</button>
      <button id="btnMenosMin">-10m</button>
      <button id="btnMaisMin">+10m</button>

      <button id="btnChuva">🌧 Chuva</button>
      <button id="btnAddMarcador"> Marcador</button>
      <input type="color" id="seletorCor" value="#ff0000">
    </div>

    <div class="hud-direita">
      <button id="btnPersonagem"> Personagem</button>
    </div>

  </div>

  <!-- MAPA -->
  <div id="mapa-container">
    <div id="mapa-viewport">
      <img id="mapa-img" src="mapa_dia.jpeg">
      <div id="chuva-overlay"></div>
      <div id="marcadores-layer"></div>

      <!-- Regiões -->
      <div class="map-label falls-keep">falls-keep</div>
      <div class="map-label magnolia">Magnolia</div>
      <div class="map-label tribo-do-sul">Tribo do Sul</div>
      <div class="map-label pais-do-ouro">país-do-ouro</div>
      <div class="map-label pais-das-maquinas">País das Máquinas</div>
      <div class="map-label pais-do-fogo">País do Fogo</div>
    </div>
  </div>

  <!-- VIDAS -->
  <div id="vidas-container">

    <div class="vida-player">
      <img class="player-img" src="owen_normal.jpg" data-nome="owen">
      <div class="vida-barra" data-vida="100">
        <div class="vida-preenchimento"></div>
      </div>
    </div>

    <div class="vida-player">
      <img class="player-img" src="mari_normal.jpg" data-nome="mari">
      <div class="vida-barra" data-vida="100">
        <div class="vida-preenchimento"></div>
      </div>
    </div>

    <div class="vida-player">
      <img class="player-img" src="mizzy_normal.jpg" data-nome="mizzy">
      <div class="vida-barra" data-vida="100">
        <div class="vida-preenchimento"></div>
      </div>
    </div>

    <div class="vida-player">
      <img class="player-img" src="ace_normal.jpg" data-nome="ace">
      <div class="vida-barra" data-vida="100">
        <div class="vida-preenchimento"></div>
      </div>
    </div>

  </div>
  <img class="player-img" src="hyacine_normal.jpg" data-nome="hyacine">
  <div class="vida-barra" data-vida="100">
    <div class="vida-preenchimento"></div>
  </div>

  <!-- MODAL VIDA -->
  <div id="vida-modal">
    <label>Vida do personagem (0-100):</label>
    <input type="number" id="vida-input" min="0" max="100">
    <button id="vida-ok">OK</button>
    <button id="vida-cancel">Cancelar</button>
  </div>

  <!-- MODAL RELÓGIO -->
  <div id="time-modal">
    <label for="time-input">Digite o novo horário (HH:MM):</label>
    <input type="time" id="time-input">
    <button id="set-time-btn">OK</button>
    <button id="cancel-time-btn">Cancelar</button>
  </div>

  <script src="mapa.js"></script>

</body>
</html>
