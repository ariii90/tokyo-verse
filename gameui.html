<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tokyo Verse - Escolha</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      color: rgb(10, 1, 1);
      overflow-x: hidden;
      background-color: black;
    }

    /* Seção das capas */
    .capas {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
    }

    .capa {
      width: 250px;
      height: 380px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .capa:hover {
      transform: scale(1.1);
      border: 2px solid gold;
    }

    /* Área das runas */
    .runas {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: url('runasespan.png') no-repeat center center;
      background-size: contain;
      background-position: center;
      position: relative;
    }

    .runa-circulo {
      width: 800px;
      height: 800px;
      position: relative;
    }

    .runa {
      width: 85px;
      height: 85px;
      position: absolute;
      cursor: pointer;
      border: 2px solid transparent;
      background: transparent;
      transition: box-shadow 0.3s, border-color 0.3s, background 0.3s;
      outline: none;
      z-index: 2;
    }

    .runa:hover {
      border: 2px solid #fff;
    }

    .runa.selecionada {
      box-shadow: 0 0 40px 20px white, 0 0 20px 4px #fff;
      border-color: #fff !important;
      background: rgba(255,255,255,0.25);
    }

    .runa.acerto {
      box-shadow: 0 0 80px 40px #00aaff, 0 0 40px 16px #00aaff;
      border-color: #00aaff !important;
      background: rgba(0,170,255,0.25);
      animation: brilharAzul 1s alternate infinite;
    }

    @keyframes brilharAzul {
      0% { box-shadow: 0 0 40px 20px #00aaff, 0 0 20px 8px #00aaff; }
      100% { box-shadow: 0 0 100px 60px #00eaff, 0 0 60px 24px #00eaff; }
    }

    .runa.erro {
      box-shadow: 0 0 50px 25px #ff0033, 0 0 25px 8px #ff0033;
      border-color: #ff0033 !important;
      background: rgba(255,0,51,0.18);
    }

    .capas-bg {
      background: url('papa.png') no-repeat center center;
      background-size: cover;
      padding: 40px 0;
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      min-height: 100vh;
    }

    /* BOTÕES DAS COMBINAÇÕES */
    .comb-btns {
      position: fixed;
      top: 50%;
      left: 30px;
      transform: translateY(-50%);
      z-index: 9999;
      display: none;
      flex-direction: column;
      gap: 14px;
      opacity: 0;
      transition: opacity 1s ease;
    }

    .comb-btns.visible {
      display: flex;
      opacity: 1;
    }

    .comb-btn {
      background: rgba(30, 25, 20, 0.6);
      color: #e2c075;
      border: 1.5px solid rgba(226, 192, 117, 0.6);
      border-radius: 8px;
      font-family: 'Cinzel', serif;
      font-size: 0.9em;
      letter-spacing: 1px;
      padding: 8px 16px;
      cursor: pointer;
      text-shadow: 0 0 6px rgba(226, 192, 117, 0.3);
      box-shadow: inset 0 0 10px rgba(226, 192, 117, 0.1);
      transition: all 0.4s ease;
      backdrop-filter: blur(3px);
    }

    .comb-btn:hover {
      border-color: rgba(255, 220, 130, 0.8);
      color: #ffdc82;
      box-shadow: 0 0 15px rgba(255, 220, 130, 0.25),
                  inset 0 0 10px rgba(255, 220, 130, 0.15);
      transform: translateX(3px);
    }

    /* SELO DO PERSONAGEM NO CENTRO */
    #selo-personagem {
    position: absolute;
    width: 150px;
    height: 150px;
    top: 50%;
    left: 48%;
    transform: translate(-50%, -50%);
    z-index: 2;
    pointer-events: none;
    opacity: 0;
}

    @keyframes aparecerSelo {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    .selo-ativo {
      display: block !important;
      animation: aparecerSelo 1s ease forwards;
    }

    .map-label {
      position: absolute;
      color: white;
      font-size: 20px;
      font-family: 'Cinzel', serif;
      text-shadow: 2px 2px 4px black;
    }
    .falls-keep {
      top: 40%; /* Ajustar conforme necessário */
      left: 30%; /* Ajustar conforme necessário */
    }
  </style>
</head>

<body>

  <!-- CAPAS -->
  <div class="capas-bg">
    <section class="capas">
      <img src="capa2.jpg" alt="Capa 1" class="capa" onclick="mostrarRunas(1)">
      <img src="capa1.jpg" alt="Capa 2" class="capa" onclick="mostrarRunas(2)">
    </section>
  </div>

  <!-- RUNAS -->
  <section class="runas" id="area-runas">
    <div class="runa-circulo">
      <button class="runa" data-id="1" style="top:12%; left:38%;"></button>
      <button class="runa" data-id="2" style="top:18%; left:66%;"></button>
      <button class="runa" data-id="3" style="top:41%; left:77%;"></button>
      <button class="runa" data-id="4" style="top:42%; left:4%;"></button>
      <button class="runa" data-id="5" style="top:62%; left:70%;"></button>
      <button class="runa" data-id="6" style="top:76%; left:41%;"></button>
      <button class="runa" data-id="7" style="top:63%; left:11%;"></button>
      <button class="runa" data-id="8" style="top:19%; left:14%;"></button>
    </div>

    <!-- SELO NO MEIO -->
    <img id="selo-personagem" class="selo-personagem" src="">
  </section>

  <!-- BOTÕES DE COMBINAÇÃO -->
  <div class="comb-btns" id="combBtns">
    <button class="comb-btn" onclick="jogadorAtual='1'">Combinação 1</button>
    <button class="comb-btn" onclick="jogadorAtual='2'">Combinação 2</button>
    <button class="comb-btn" onclick="jogadorAtual='3'">Combinação 3</button>
    <button class="comb-btn" onclick="jogadorAtual='4'">Combinação 4</button>
    <button class="comb-btn" onclick="jogadorAtual='5'">Combinação 5</button>
    <button class="comb-btn" onclick="jogadorAtual='6'">Combinação 6</button>
    <button class="comb-btn" onclick="jogadorAtual='7'">Combinação 7</button>
    <button class="comb-btn" onclick="jogadorAtual='8'">Combinação 8</button>
  </div>

  <div class="map-label falls-keep" style="display: none;">FALLS KEEP</div>

  <script>
    let jogadorAtual = null;
    let escolhidas = [];

    const senhas = {
      1: ["2", "5", "6"],
      2: ["1", "4", "7"],
      3: ["3", "6", "8"],
      4: ["2", "4", "8"],
      5: ["1", "3", "5"],
      6: ["2", "7", "8"],
      7: ["4", "5", "6"],
      8: ["1", "2", "3"]
    };

    function mostrarRunas(jogador) {
      if (jogador === 1) {
        jogadorAtual = jogador;
        document.getElementById("area-runas").scrollIntoView({ behavior: 'smooth' });
        const btns = document.getElementById("combBtns");
        btns.classList.add("visible");
      } else if (jogador === 2) {
        const telaCinza = document.createElement("div");
        telaCinza.style.position = "fixed";
        telaCinza.style.top = "0";
        telaCinza.style.left = "0";
        telaCinza.style.width = "100%";
        telaCinza.style.height = "100%";
        telaCinza.style.backgroundColor = "black";
        telaCinza.style.display = "flex";
        telaCinza.style.flexDirection = "column";
        telaCinza.style.alignItems = "center";
        telaCinza.style.justifyContent = "center";
        telaCinza.style.zIndex = "2000";

        const mensagem = document.createElement("div");
        mensagem.style.color = "white";
        mensagem.style.fontSize = "24px";
        mensagem.style.marginBottom = "20px";
        mensagem.textContent = "Opss... parece que ainda não terminamos isso por aqui ainda";

        const imgContainer = document.createElement("div");
        imgContainer.style.display = "flex";
        imgContainer.style.justifyContent = "center";
        imgContainer.style.marginBottom = "20px";

        const imagens = [
          "./acegb.jpeg",
          "./ciclopegb.jpeg",
          "./dizzygb.jpeg",
          "./hakugb.jpeg",
          "./huggiegb.jpeg",
          "./hyacinegb.jpeg",
          "./marigb.jpeg",
          "./owengb.jpeg",
          "./shadowgb.jpeg"
        ];
        let imgIndex = 0;

        const imgElement = document.createElement("img");
        imgElement.style.width = "300px";
        imgElement.style.height = "300px";
        imgElement.style.objectFit = "contain";
        imgElement.src = imagens[imgIndex];
        imgContainer.appendChild(imgElement);

        const imgCheckInterval = setInterval(() => {
          imgIndex = (imgIndex + 1) % imagens.length;
          const imgPath = imagens[imgIndex];
          imgElement.src = imgPath;
          imgElement.onerror = () => {
            console.error(`Erro: Imagem não encontrada ou caminho incorreto: ${imgPath}`);
            imgElement.src = "https://via.placeholder.com/300?text=Imagem+não+encontrada";
          };
        }, 2000);

        const botaoVoltar = document.createElement("button");
        botaoVoltar.textContent = "Voltar";
        botaoVoltar.style.marginTop = "20px";
        botaoVoltar.style.padding = "10px 20px";
        botaoVoltar.style.fontSize = "18px";
        botaoVoltar.style.color = "white";
        botaoVoltar.style.backgroundColor = "#444";
        botaoVoltar.style.border = "none";
        botaoVoltar.style.borderRadius = "5px";
        botaoVoltar.style.cursor = "pointer";

        botaoVoltar.addEventListener("click", () => {
          clearInterval(imgCheckInterval);
          document.body.removeChild(telaCinza);
          document.querySelector(".capas-bg").scrollIntoView({ behavior: 'smooth' });
        });

        telaCinza.appendChild(mensagem);
        telaCinza.appendChild(imgContainer); // Adiciona o container de imagens antes do botão
        telaCinza.appendChild(botaoVoltar);
        document.body.appendChild(telaCinza);
      }
    }

    const runas = document.querySelectorAll(".runa");

    runas.forEach(runa => {
      runa.addEventListener("click", () => {
        if (!jogadorAtual) return;

        if (escolhidas.length < 3 && !runa.classList.contains("selecionada")) {
          escolhidas.push(runa.dataset.id);
          runa.classList.add("selecionada");
        }

        if (escolhidas.length === 3) {
          const escolhidasSorted = [...escolhidas].map(String).sort();
          const senha = senhas[jogadorAtual];
          const senhaSorted = senha ? [...senha].map(String).sort() : [];

          const acertou = JSON.stringify(escolhidasSorted) === JSON.stringify(senhaSorted);

          if (acertou) {
            // efeito azul
            escolhidas.forEach(id => {
              const el = document.querySelector(`.runa[data-id='${id}']`);
              el.classList.remove("selecionada");
              el.classList.add("acerto");
            });

            // SELO
            const selo = document.getElementById("selo-personagem");
            selo.src = `imagem.combinacao${jogadorAtual}.png`;
            selo.classList.add("selo-ativo");

            setTimeout(() => {
              window.location.href = "mapa.html";
            }, 2500);

          } else {
            // erro
            escolhidas.forEach(id => {
              const r = document.querySelector(`.runa[data-id='${id}']`);
              r.classList.remove("selecionada");
              r.classList.add("erro");
              setTimeout(() => r.classList.remove("erro"), 1000);
            });

            setTimeout(() => {
              runas.forEach(r => r.classList.remove("selecionada"));
              escolhidas = [];
            }, 1000);
          }

          escolhidas = [];
        }
      });
    });
  </script>

</body>
</html>
